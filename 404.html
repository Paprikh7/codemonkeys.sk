<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Code Monkeys s. r. o.</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #FAFAF7; --text: #1A1A17; --muted: #5B5B55; --accent: #8A5300; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121210; --text: #F2F1EC; --muted: #A8A69D; --accent: #F5C451; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: var(--bg); color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This page does not exist. Go to the <a href="/">home page</a>.</p>
  </main>
</body>
</html>
